<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Verification</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(120deg, #134e5e, #71b280);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .certificate-card {
            background: #ffffff;
            width: 390px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .title {
            text-align: center;
            margin-bottom: 6px;
        }

        .title h2 {
            margin: 0;
            color: #134e5e;
            font-size: 22px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 22px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px dashed #dcdcdc;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .value {
            font-size: 14px;
            color: #555;
            text-align: right;
        }

        .certificate-no {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #0f5132;
            background: #e6f4ea;
            padding: 10px;
            border-radius: 10px;
        }

        .verified {
            margin-top: 16px;
            text-align: center;
            color: #198754;
            font-weight: bold;
            font-size: 15px;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="certificate-card">
    <div class="title">
        <h2>Certificate Verified</h2>
    </div>
    <div class="subtitle">
        Digital Training Certificate Validation
    </div>

    <div class="info-row">
        <div class="label">Trainee Name</div>
        <div class="value">Chandrakanta Malik</div>
    </div>

    <div class="info-row">
        <div class="label">Father Name</div>
        <div class="value">Jojan Malik</div>
    </div>

    <div class="info-row">
        <div class="label">Training Duration</div>
        <div class="value">Aug 2016 – Jul 2018</div>
    </div>

    <div class="info-row">
        <div class="label">Certificate Issue Date</div>
        <div class="value">16 Oct 2018</div>
    </div>

    <div class="certificate-no">
        Certificate No: 001608210062835
    </div>

    <div class="verified">
        ✔ Authentic & Verified Certificate
    </div>

    <div class="footer">
        Verified through official QR code scan
    </div>
</div>

</body>
</html>
